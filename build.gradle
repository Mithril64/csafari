plugins {
    // net.fabricmc.fabric-loom = the NON-remapping plugin, required for 26.1+
    // (use net.fabricmc.fabric-loom-remap only for 1.21.11 and older)
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // NOTE: no `mappings` line. 26.1+ ships with official names + parameter names.

    // NOTE: plain `implementation`, not `modImplementation`. The non-remap Loom
    // plugin never creates the mod* configurations.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.flk_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

kotlin {
    jvmToolchain(25)
}

// NOTE: `jar`, not `remapJar` - there is nothing to remap.
jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
